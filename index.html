    <!-- Instant Splash Screen Styles -->
    <style>
        #splash-screen {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            background: #fafaf9;
            background: radial-gradient(circle at 50% 38%, #e0f2fe 0%, #fafaf9 68%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 99999;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Heebo', sans-serif;
            text-align: center;
            padding: 24px;
            box-sizing: border-box;
            direction: rtl;
        }
        .splash-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            animation: splashFadeIn 0.35s ease-out;
        }
        .splash-icon-wrapper {
            width: 104px;
            height: 104px;
            border-radius: 26px;
            box-shadow: 0 16px 36px -6px rgba(186, 230, 253, 0.7), 0 4px 12px rgba(0, 0, 0, 0.04);
            overflow: hidden;
            background: #ffffff;
            margin-bottom: 20px;
            animation: splashFloat 2.6s ease-in-out infinite;
        }
        .splash-icon {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .splash-title {
            font-size: 26px;
            font-weight: 900;
            color: #1c1917;
            margin: 0 0 6px 0;
            letter-spacing: -0.5px;
        }
        .splash-title-pro {
            background: linear-gradient(135deg, #9333ea, #38bdf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .splash-subtitle {
            font-size: 13px;
            font-weight: 600;
            color: #78716c;
            margin: 0;
        }
        .splash-bar {
            width: 140px;
            height: 5px;
            background: #e7e5e4;
            border-radius: 99px;
            overflow: hidden;
            margin-top: 28px;
            position: relative;
        }
        .splash-bar::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            width: 40%;
            background: linear-gradient(90deg, #9333ea, #38bdf8);
            border-radius: 99px;
            animation: splashShimmer 1.3s ease-in-out infinite alternate;
        }
        .splash-loading-text {
            font-size: 11px;
            color: #a8a29e;
            font-weight: 700;
            margin-top: 12px;
        }
        @keyframes splashFadeIn {
            from { opacity: 0; transform: scale(0.96); }
            to { opacity: 1; transform: scale(1); }
        }
        @keyframes splashFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-7px); }
        }
        @keyframes splashShimmer {
            0% { left: -10%; width: 35%; }
            100% { left: 75%; width: 35%; }
        }
    </style>

    <!-- Immediate Crown State Calibration with Canonical wonWeeks -->
    <script>
    (function() {
        try {
        const k = 'studyStreakData_DB_v7';
            const raw = localStorage.getItem(k);
            if (raw) {
                const data = JSON.parse(raw);
                if (data && data.users) {
                    Object.keys(data.users).forEach(u => {
                        const usr = data.users[u];
                        if (usr) {
                            // Purge dummy test baseline & duplicates
                            if (Array.isArray(usr.streakHistory)) {
                                usr.streakHistory = usr.streakHistory.filter(s => s && s.id !== 'sh_september_baseline');
                                const seenTasks = new Set();
                                usr.streakHistory = usr.streakHistory.filter(s => {
                                    if (!s) return false;
                                    if (s.brokenByTaskId) {
                                        if (seenTasks.has(s.brokenByTaskId)) return false;
                                        seenTasks.add(s.brokenByTaskId);
                                    }
                                    return true;
                                });
                            }
                            // Clean bogus entries from pointsHistory and ensure tasks in localStorage match
                            if (Array.isArray(usr.pointsHistory)) {
                                usr.pointsHistory = usr.pointsHistory.filter(p => {
                                    if (!p) return false;
                                    const sub = String(p.subjectName || '');
                                    const id = String(p.id || '');
                                    const dt = String(p.date || '');
                                    const taskId = String(p.taskId || '');
                                    const title = String(p.taskTitle || '');
                                    // history-subject rows: only those that existed at the 2026-11-13 hotfix (later study is legitimate)
                                    if (sub.includes('היסטוריה')) { const pm = new Date(p.date).getTime(); if (!isFinite(pm) || pm < Date.parse('2026-11-13T00:41:00.000Z')) return false; }
                                    if (id.includes('1794473352381') || taskId === 't_1794473352381' || (title.includes('11.11.26') && sub.includes('פיזיקה'))) return false;
                                    if (id.includes('1794473104904') || taskId === 't_1794473104904' || (title.includes('11.11.26') && sub.includes('מתמטיקה'))) return false;
                                    if (id.startsWith('ph_t_1794521101639_') || (dt.startsWith('2026-11-13T01:20') && sub.includes('מדעי המחשב'))) return false;
                                    return true;
                                });
                            }
                            if (Array.isArray(usr.tasks)) {
                                usr.tasks = usr.tasks.map(t => {
                                    if (t.id === 't_1794473104904' || t.id === 't_1794473352381') {
                                        // locked uncompleted unless genuinely submitted after the hotfix
                                        const cm = new Date(t.completedAt).getTime();
                                        if (isFinite(cm) && cm >= Date.parse('2026-11-13T00:41:00.000Z')) return t;
                                        return { ...t, completed: false, completedAt: null, pointsEarned: null };
                                    }
                                    return t;
                                });
                            }

                            // Detect uncompleted overdue task (ignoring already-processed tasks)
                            const now = Date.now();
                            const streakStartMs = usr.currentStreakStart ? new Date(usr.currentStreakStart).getTime() : 0;
                            const hasOverdue = (usr.tasks || []).some(t => {
                                if (!t || t.completed || t.completedAt || t.givenUp || t.isLessonLog || t.isPracticeSession || t.isFlexibleExamSession || t.streakBreakProcessed) return false;
                                if (!t.dueDate) return false;
                                const dueTimeStr = t.dueTime || '23:59:59';
                                const due = new Date(`${t.dueDate}T${dueTimeStr}`).getTime();
                                if (isNaN(due)) return false;
                                if (streakStartMs && due < streakStartMs) return false;
                                return now > (due + 5 * 60 * 1000);
                            });
                            if (hasOverdue) {
                                if (usr.taskStreak > 0) {
                                    usr.longestStreak = Math.max(usr.longestStreak || 0, usr.taskStreak);
                                    usr.taskStreak = 0;
                                }
                            }
                        }
                        if (usr && Array.isArray(usr.badges)) {
                            usr.badges.forEach(b => {
                                if (b && b.id === 'b_weekly_champ') {
                                    if (u === 'שליי' || usr.name === 'שלי') {
                                        b.wonWeeks = Array.isArray(b.wonWeeks) && b.wonWeeks.length >= 5 
                                            ? Array.from(new Set(b.wonWeeks)) 
                                            : ['2026-W37', '2026-W38', '2026-W40', '2026-W42', '2026-W44'];
                                        b.count = b.wonWeeks.length;
                                        b.lastWonWeek = '2026-W44';
                                        // Ensure longestStreak preserves peak streak
                                        if (usr.taskStreak > (usr.longestStreak || 0)) {
                                            usr.longestStreak = usr.taskStreak;
                                        }
                                    }
                                    if (u.includes('ענבר') || (usr.name && usr.name.includes('ענבר'))) {
                                        b.wonWeeks = Array.isArray(b.wonWeeks) && b.wonWeeks.length >= 4 && !b.wonWeeks.includes('2026-W44')
                                            ? Array.from(new Set(b.wonWeeks))
                                            : ['2026-W36', '2026-W39', '2026-W41', '2026-W43'];
                                        b.count = b.wonWeeks.length;
                                        b.lastWonWeek = '2026-W43';
                                    }
                                }
                            });
                        }
                    });
                    localStorage.setItem(k, JSON.stringify(data));
                }
            }
        } catch(e) {}
    })();
    </script>
